<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugaz Asesoría Energética - Compara tu Ahorro</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>LUGAZ ASESORÍA ENERGÉTICA SL</h1>
        <p class="slogan">Compara tu factura de luz y comprueba tu ahorro.</p>
        
        <div class="card" id="lead-card">
            <h2>Paso 1: ¿Dónde te enviamos la comparativa?</h2>
            
            <form id="leadForm" 
                  action="https://script.google.com/macros/s/AKfycbxLXoTpxazW7bLZvJxlSyKEvQnw6BiAuFp6y5-zazMcZw-Z00j7nD3iFbtosjpZxzO0/exec" 
                  method="POST" 
                  target="oculto"
                  onsubmit="document.getElementById('estado').textContent = '✅ Guardando datos...'; document.getElementById('submitBtn').disabled = true;">
                
                <input type="hidden" name="action" value="guardarLead"> 
                
                <input type="email" id="email" name="email" placeholder="Email" required>
                <input type="tel" id="telefono" name="telefono" placeholder="Teléfono Móvil (obligatorio)" pattern="[0-9]{9}" required>
                
                <button type="submit" id="submitBtn">Comenzar Ahorro</button>
                <div id="estado" style="margin-top: 15px; color: #fbbf24; font-weight: 600;"></div>
            </form>
        </div>
    </div>
    
    <iframe name="oculto" id="oculto" style="display:none;"></iframe>
    
    </body>
</html>
