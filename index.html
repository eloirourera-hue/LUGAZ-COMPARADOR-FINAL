<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugaz Asesoría Energética - Compara tu Ahorro</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>LUGAZ ASESORÍA ENERGÉTICA SL</h1>
        <p class="slogan">Compara tu factura de luz y comprueba tu ahorro.</p>
        
        <div class="card" id="lead-card">
            <h2>Paso 1: ¿Dónde te enviamos la comparativa?</h2>
            
            <form id="leadForm" 
                  action="https://script.google.com/macros/s/AKfycbxLXoTpxazW7bLZvJxlSyKEvQnw6BiAuFp6y5-zazMcZw-Z00j7nD3iFbtosjpZxzO0/exec" 
                  method="POST" 
                  target="oculto"
                  onsubmit="return iniciarEnvio()">
                
                <input type="hidden" name="action" value="guardarLead"> 
                
                <input type="email" id="email" name="email" placeholder="Email" required>
                <input type="tel" id="telefono" name="telefono" placeholder="Teléfono Móvil (obligatorio)" pattern="[0-9]{9}" required>
                
                <button type="submit" id="submitBtn">Comenzar Ahorro</button>
                <div id="estado" style="margin-top: 15px; color: #fbbf24; font-weight: 600;"></div>
            </form>
        </div>
    </div>
    
    <iframe name="oculto" id="oculto" style="display:none;"></iframe>
    
    <script>
        const TIEMPO_MAXIMO_ESPERA = 5000; // 5 segundos
        let temporizadorRedireccion;

        function iniciarEnvio() {
            const estado = document.getElementById('estado');
            const submitBtn = document.getElementById('submitBtn');
            
            estado.textContent = '✅ Guardando datos...';
            submitBtn.disabled = true;

            // Limpiamos cualquier temporizador anterior
            clearTimeout(temporizadorRedireccion); 

            // Iniciamos un temporizador. Si Apps Script no responde o es bloqueado, 
            // asumimos éxito después del tiempo máximo (5 segundos) 
            // ya que sabemos que el Apps Script es exitoso.
            temporizadorRedireccion = setTimeout(forzarRedireccion, TIEMPO_MAXIMO_ESPERA);
            
            return true; // Continúa con el envío del formulario
        }

        // Función que se dispara después del tiempo de espera
        function forzarRedireccion() {
            const estado = document.getElementById('estado');
            const email = document.getElementById('email').value;
            
            // Si el botón sigue deshabilitado (no hubo un error JavaScript que lo re-habilitara)
            if (document.getElementById('submitBtn').disabled) {
                 estado.textContent = '✅ Datos guardados. Redirigiendo...';
                 
                 setTimeout(() => {
                    // Redirige a factura.html
                    window.location.href = `factura.html?email=${encodeURIComponent(email)}`;
                 }, 500);
            } else {
                 // Si el botón está habilitado, significa que hubo un error y no se debe redirigir
                 estado.textContent = '❌ Error de tiempo. Inténtalo de nuevo.';
            }
        }

        // Opcional: Intentar detener el temporizador si el iframe carga antes
        document.getElementById('oculto').onload = function() {
            clearTimeout(temporizadorRedireccion);
            // Ejecutamos forzarRedireccion() inmediatamente
            forzarRedireccion();
        };

    </script>
</body>
</html>
